<div class="new-password-field">
  <div class="ui-field" [class.ui-field--error]="password?.touched && password?.invalid">
    <span class="ui-field__addon" aria-hidden="true"><app-field-icon name="lock" /></span>
    <input
      id="password"
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
      [placeholder]="passwordPlaceholder()"
      class="ui-field__control"
      autocomplete="new-password"
    />
    <span class="ui-field__trailing">
      <button
      type="button"
      (click)="toggleShowPassword()"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      class="ui-field__icon-btn"
    >
      @if (showPassword()) {
        <!-- Eye Slash Icon (Hide) -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      } @else {
        <!-- Eye Icon (Show) -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      }
    </button>
  </span>
  </div>
  @if (password?.touched && password?.invalid) {
    <p class="new-password-error">{{ errorFor(password, 'Password') }}</p>
  }
</div>
