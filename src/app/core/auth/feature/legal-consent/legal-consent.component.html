<div class="legal-container">
  <h1 class="legal-title">Before you continue</h1>
  <p class="legal-subtitle">Please review and accept the updated terms to continue to your workspace.</p>

  <div class="legal-docs-list">
    @for (doc of store.pendingLegalDocuments(); track doc.document_type) {
      <div class="legal-doc-card">
        <div class="legal-doc-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="legal-doc-info">
          <h3 class="legal-doc-title">{{ doc.title }}</h3>
          <p class="legal-doc-version">Version {{ doc.version }}</p>
        </div>
      </div>
    }
  </div>

  @if (store.error()) {
    <p class="legal-server-error" role="alert">{{ store.error() }}</p>
  }

  <button
    type="button"
    class="legal-btn"
    [disabled]="store.loading()"
    (click)="accept()"
  >
    @if (store.loading()) {
      <span class="legal-spinner" aria-hidden="true"></span>
      Accepting…
    } @else {
      Accept and continue
    }
  </button>
</div>
