<div class="login-container">
  <h1 class="login-title">Welcome back!</h1>

  <!-- Google SSO Button -->
  <button
    type="button"
    class="login-google-btn"
    (click)="signInWithGoogle()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <span>Continue with Google</span>
  </button>

  <!-- Divider -->
  <div class="login-divider" aria-hidden="true">
    <span>or</span>
  </div>

  <!-- Credentials Form -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
    <div class="login-field">
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Work email"
        class="login-input"
        [class.login-input--error]="form.controls.email.touched && form.controls.email.invalid"
        autocomplete="email"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="login-error-text">Enter a valid email address.</p>
      }
    </div>

    <div class="login-field">
      <div class="login-input-wrapper">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="Password"
          class="login-input login-input--password"
          [class.login-input--error]="form.controls.password.touched && form.controls.password.invalid"
          autocomplete="current-password"
        />
        <button
          type="button"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          class="login-toggle-pw"
        >
          @if (showPassword()) {
            <!-- Eye Slash Icon (Hide) -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          } @else {
            <!-- Eye Icon (Show) -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="login-error-text">Password is required.</p>
      }
    </div>

    @if (store.error()) {
      <p class="login-server-error" role="alert">{{ store.error() }}</p>
    }

    <button
      type="submit"
      class="login-btn"
      [class.login-btn--disabled]="form.invalid || store.loading()"
      [disabled]="store.loading()"
    >
      @if (store.loading()) {
        <span class="login-spinner" aria-hidden="true"></span>
        Logging in…
      } @else {
        Log In
      }
    </button>
  </form>

  <a routerLink="/auth/forgot-password" class="login-forgot-link">
    Forgot Password?
  </a>
</div>
