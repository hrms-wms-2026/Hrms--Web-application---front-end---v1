@if (currentPage(); as page) {
  <div class="back-bar">
    <button type="button" class="back-bar__button" (click)="back()" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <button
      type="button"
      class="back-bar__switch"
      aria-haspopup="menu"
      [attr.aria-expanded]="switcherOpen()"
      [attr.aria-label]="page.label + ', switch page in ' + sectionTitle()"
      (click)="toggleSwitcher()"
    >
      <span class="back-bar__title">{{ page.label }}</span>
      <svg class="back-bar__chevron" [class.back-bar__chevron--open]="switcherOpen()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  @if (switcherOpen()) {
    <div class="switcher__backdrop" (click)="closeSwitcher()" aria-hidden="true"></div>
    <nav class="switcher" [attr.aria-label]="sectionTitle() + ' pages'">
      <p class="switcher__title">{{ sectionTitle() }}</p>
      @for (group of pageGroups(); track $index) {
        @if (group.title) {
          <p class="switcher__group-title">{{ group.title }}</p>
        }
        <ul class="switcher__list">
          @for (item of group.items; track item.id) {
            <li>
              <a
                class="switcher__item"
                [class.switcher__item--current]="item.id === page.id"
                [attr.aria-current]="item.id === page.id ? 'page' : null"
                [routerLink]="item.path"
                (click)="closeSwitcher()"
              >
                <span>{{ item.label }}</span>
                @if (item.id === page.id) {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                }
              </a>
            </li>
          }
        </ul>
      }
    </nav>
  }
}
