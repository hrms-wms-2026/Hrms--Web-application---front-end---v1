<div class="top-navbar__left">
  <app-company-selector />
</div>

<div class="top-navbar__center">
  <div class="top-navbar__search">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Search</span>
    <kbd>Ctrl K</kbd>
  </div>
</div>

<div class="top-navbar__right">
  <button type="button" class="top-navbar__icon-btn" aria-label="Notifications" title="Notifications">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </svg>
    <span class="top-navbar__notification-badge" aria-hidden="true"></span>
  </button>
  <app-profile-menu [avatarUrl]="avatarUrl()" [userName]="userName()" [email]="email()" />
</div>
