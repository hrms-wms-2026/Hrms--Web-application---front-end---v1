<div class="top-navbar__left">
  <app-company-selector />
</div>

<div class="top-navbar__center">
  <button type="button" class="top-navbar__search" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" (click)="quickSearch.open()">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Search…</span>
    <kbd>{{ shortcutLabel }}</kbd>
  </button>
</div>

<div class="top-navbar__right">
  <!-- Bell first, then the page action (it opens leftward and pushes the bell along), then the profile. -->
  <app-notification-bell />
  <app-page-toolbar />
  <app-profile-menu [avatarUrl]="avatarUrl()" [userName]="userName()" [email]="email()" />
</div>
