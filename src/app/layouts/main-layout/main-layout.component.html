<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="main-layout" [class.main-layout--has-sub-sidebar]="navState.hasVisibleSubSidebar()">
  <app-side-navbar class="main-layout__rail" />
  <app-top-navbar class="main-layout__topbar" [email]="email()" [avatarUrl]="avatarUrl()" [userName]="userName()" />

  @if (navState.hasVisibleSubSidebar()) {
    @if (navState.customSubSidebar() === 'inbox') {
      <!-- Loaded only when the inbox is open. -->
      @defer (on immediate) {
        <app-inbox-chat-sidebar class="main-layout__sub-sidebar" />
      }
    } @else {
      <app-sub-sidebar
        class="main-layout__sub-sidebar"
        [sectionLabel]="navState.activeItem()!.label"
        [items]="navState.activeChildren()"
        [content]="navState.pageSubSidebar()"
        [actions]="navState.pageSubSidebarActions()"
      />
    }
  }

  <main
    id="main-content"
    class="main-content"
    [class.main-content--gated]="monitoringEnabled && !trayPresence.canRenderProtectedContent()"
    tabindex="-1"
  >
    <app-mobile-section-nav />
    <div class="main-content__viewport">
      @if (!monitoringEnabled || trayPresence.canRenderProtectedContent()) {
        <app-announcement-banner />
        <router-outlet />
      } @else {
        <app-locked-workspace-preview />
        @if (trayPresence.isBlocking()) {
          <app-tray-activation-gate />
        }
      }
    </div>
    <app-drafts-bar />
  </main>

  <app-mobile-bottom-nav />
  <app-draft-modal-host />
  <app-unsaved-changes-dialog />
</div>

<div
  id="global-notification-container"
  class="global-notification-container"
  aria-label="Application notifications"
>
  <app-toast-host />
</div>

<div id="global-dialog-container" class="global-dialog-container"></div>

<div class="sr-only" aria-live="polite" aria-atomic="true">
  {{ announcementMessage() }}
</div>
