<nav class="sub-sidebar" [attr.aria-label]="sectionLabel() + ' navigation'">
  <div class="sub-sidebar__header">
    <h2 class="sub-sidebar__heading">{{ sectionLabel() }}</h2>
    <button
      type="button"
      class="sub-sidebar__collapse-btn"
      (click)="collapse()"
      title="Close sidebar (Ctrl+\)"
      aria-label="Close sidebar"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="11 17 6 12 11 7"></polyline>
        <polyline points="18 17 13 12 18 7"></polyline>
      </svg>
    </button>
  </div>
  @for (group of groups(); track $index) {
    <div class="sub-sidebar__section">
      @if (group.title) {
        <h3 class="sub-sidebar__section-title">{{ group.title }}</h3>
      }
      <ul class="sub-sidebar__list" [attr.aria-label]="group.title">
        @for (item of group.items; track item.id) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="sub-sidebar__link--active" [routerLinkActiveOptions]="{ exact: item.exact === true }" class="sub-sidebar__link">{{ item.label }}</a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
