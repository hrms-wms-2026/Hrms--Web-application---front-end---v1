<div class="toast-stack" aria-label="Notifications stack">
  @for (toast of notifications(); track toast.id) {
    <div
      class="toast-item toast-item--{{ toast.kind }}"
      [attr.role]="getRole(toast.kind)"
      [attr.aria-live]="getAriaLive(toast.kind)"
    >
      <div class="toast-item__icon" aria-hidden="true">
        @if (toast.kind === 'success') {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        } @else if (toast.kind === 'error') {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="13"/>
            <circle cx="12" cy="18" r="1.25" fill="currentColor"/>
          </svg>
        } @else if (toast.kind === 'warning') {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="13"/>
            <circle cx="12" cy="18" r="1.25" fill="currentColor"/>
          </svg>
        } @else {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="6" r="1.25" fill="currentColor"/>
            <line x1="12" y1="11" x2="12" y2="19"/>
          </svg>
        }
      </div>

      <div class="toast-item__content">
        <span class="toast-item__message">{{ toast.message }}</span>
      </div>

      <button
        type="button"
        class="toast-item__close"
        aria-label="Dismiss notification"
        (click)="dismiss(toast.id)"
      >
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
