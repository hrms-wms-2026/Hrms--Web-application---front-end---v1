<header class="bh-header-bar">
  <nav class="bh-breadcrumb" aria-label="Breadcrumb">
    <span class="bh-breadcrumb__item bh-breadcrumb__item--parent">
      @if (icon()) {
        <app-nav-icon [name]="icon()!" class="bh-breadcrumb__icon" />
      }
      <span>{{ parentLabel() }}</span>
    </span>
    <svg class="bh-breadcrumb__sep" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
    <span class="bh-breadcrumb__item bh-breadcrumb__item--current" aria-current="page">{{ currentLabel() }}</span>
  </nav>
</header>
