<div class="dp-container">
  @if (label()) {
    <label [for]="inputId" class="dp-label">{{ label() }}</label>
  }

  <div class="dp-input-wrapper" (click)="togglePopover()">
    <input
      [id]="inputId"
      type="text"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readonly]="readonlyInput()"
      [value]="value()"
      (input)="onInputText($event)"
      [attr.maxlength]="10"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? errorId() : hint() ? hintId() : null"
      class="dp-input"
    />
    <button
      type="button"
      class="dp-icon-trigger"
      (click)="$event.stopPropagation(); togglePopover()"
      [attr.aria-expanded]="isOpen()"
      title="Open calendar picker"
      aria-label="Open calendar picker"
      [disabled]="disabled()"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </button>
  </div>

  @if (error()) {
    <span [id]="errorId()" class="dp-error-text">{{ error() }}</span>
  } @else if (hint()) {
    <span [id]="hintId()" class="dp-hint-text">{{ hint() }}</span>
  }

  @if (isOpen()) {
    <div class="dp-popover" [class.dp-popover--up]="openUpward()" role="dialog" aria-label="Calendar picker">
      <div class="dp-header">
        <button type="button" class="dp-nav-btn" (click)="prevMonth()" title="Previous month" aria-label="Previous month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>

        <span class="dp-month-title">{{ currentMonthLabel() }}</span>

        <button type="button" class="dp-nav-btn" (click)="nextMonth()" title="Next month" aria-label="Next month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="dp-weekdays">
        @for (wd of weekdayNames; track wd) {
          <span class="dp-weekday">{{ wd }}</span>
        }
      </div>

      <div class="dp-grid">
        @for (day of calendarDays(); track day.formattedDate) {
          <button
            type="button"
            class="dp-day-btn"
            [class.dp-day-btn--outside]="!day.isCurrentMonth"
            [class.dp-day-btn--today]="day.isToday"
            [class.dp-day-btn--selected]="day.isSelected"
            (click)="selectDay(day)"
          >
            <span>{{ day.date }}</span>
            @if (day.isToday && !day.isSelected) {
              <span class="dp-today-dot"></span>
            }
          </button>
        }
      </div>

      <div class="dp-footer">
        <button type="button" class="dp-today-link" (click)="goToToday()">Today</button>
      </div>
    </div>
  }
</div>
