<!-- Quiet Operations Desk: manual entries expose every exceptional value and require a reason. -->
<app-modal [open]="open" title="Add Manual Entitlement" (closed)="onClose()"><div class="emm-body"><button type="button" class="emm-picker-trigger" (click)="pickerOpen.set(true)">{{ employeeId() ? 'Employee selected' : 'Choose employee' }}</button><app-person-picker-dialog [open]="pickerOpen()" title="Choose employee" icon="user" [multiple]="false" (confirmed)="onEmployeePicked($event[0])" (closed)="pickerOpen.set(false)" /><div class="emm-field"><span>Leave type</span><app-select ariaLabel="Leave type" placeholder="Select a leave type" [options]="leaveTypeOptions" [value]="leaveTypeId() ?? ''" (valueChange)="leaveTypeId.set($event || null)" /></div><div class="emm-two"><label class="emm-field"><span>Total hours</span><input class="ui-input" type="number" step="0.5" (input)="totalHours.set($any($event.target).value === '' ? null : $any($event.target).valueAsNumber)" /></label><label class="emm-field"><span>Carried forward</span><input class="ui-input" type="number" step="0.5" [value]="carriedForwardHours()" (input)="carriedForwardHours.set($any($event.target).valueAsNumber || 0)" /></label></div><label class="emm-field"><span>Reason</span><textarea class="ui-input" rows="2" (input)="reason.set($any($event.target).value)"></textarea></label>@if (actionError) { <p class="emm-error">{{ actionError }}</p> }<div class="emm-actions"><button type="button" class="emm-secondary" (click)="onClose()">Cancel</button><button type="button" class="emm-primary" [disabled]="saving" (click)="onSubmit()">{{ saving ? 'Saving…' : 'Save entitlement' }}</button></div></div></app-modal>
