<table class="lra-table">
  <thead>
    <tr><th>Name</th><th>Department</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Status</th></tr>
  </thead>
  <tbody>
    @for (row of rows; track row.requestId) {
      <tr data-testid="all-request-row" (click)="rowClicked.emit(row.requestId)">
        <td>{{ row.employeeName }}</td>
        <td>{{ row.departmentName ?? '-' }}</td>
        <td>{{ row.leaveTypeName }}</td>
        <td>{{ row.startDate }}</td>
        <td>{{ row.endDate }}</td>
        <td>{{ row.totalDays }}</td>
        <td><span class="lra-status" [class]="'lra-status-' + row.status">{{ statusLabel(row.status) }}</span></td>
      </tr>
    }
  </tbody>
</table>
