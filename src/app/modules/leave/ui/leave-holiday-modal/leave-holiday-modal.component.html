<app-modal [open]="open" title="Company holidays" (closed)="onClose()">
  <div class="lhm-body">
    <p class="lhm-help">These days do not count as leave. They appear on the team calendar.</p>
    @if (holidays.length > 0) {
      <ul class="lhm-list">
        @for (row of holidays; track row.id) {
          <li>
            <span>{{ row.name }} · {{ row.date }}@if (row.endDate !== row.date) { – {{ row.endDate }} }</span>
            <button type="button" class="lhm-remove" [attr.aria-label]="'Remove ' + row.name" (click)="remove.emit(row.id)">Remove</button>
          </li>
        }
      </ul>
    }
    <label class="lhm-field">
      <span>Name</span>
      <input class="ui-input" type="text" [value]="name()" (input)="name.set($any($event.target).value)" aria-label="Holiday name" />
    </label>
    <app-date-picker label="Date" [value]="date()" (valueChange)="date.set($event)" />
    <app-date-picker label="End date (optional)" [value]="endDate()" (valueChange)="endDate.set($event)" />
    @if (actionError) { <p class="lhm-error">{{ actionError }}</p> }
    <div class="lhm-actions">
      <button type="button" class="lhm-secondary" (click)="onClose()">Close</button>
      <button type="button" class="lhm-primary" data-testid="save-holiday" [disabled]="saving || !name().trim() || !date()" (click)="onSubmit()">
        {{ saving ? 'Saving…' : 'Add holiday' }}
      </button>
    </div>
  </div>
</app-modal>
