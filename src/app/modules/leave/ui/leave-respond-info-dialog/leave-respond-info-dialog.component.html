<app-modal [open]="open" title="Reply to your manager" (closed)="onClose()">
  <div class="lri-body">
    @if (question) {
      <p class="lri-question" data-testid="info-question">{{ question }}</p>
    }
    <label class="lri-field">
      <span>Your reply</span>
      <textarea rows="3" [value]="message()" (input)="message.set($any($event.target).value)" aria-label="Reply to manager"></textarea>
    </label>
    @if (sendError) { <p class="lri-error">{{ sendError }}</p> }
    <div class="lri-actions">
      <button type="button" class="lri-secondary" (click)="onClose()">Cancel</button>
      <button type="button" class="lri-primary" data-testid="send-reply" [disabled]="sending || !message().trim()" (click)="onConfirm()">
        {{ sending ? 'Sending…' : 'Send reply' }}
      </button>
    </div>
  </div>
</app-modal>
