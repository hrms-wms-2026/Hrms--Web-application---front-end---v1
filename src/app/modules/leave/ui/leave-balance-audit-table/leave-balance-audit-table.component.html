<app-data-table [columns]="columns" [rows]="rows" [trackBy]="trackById" [rowTestId]="rowTestId" caption="Leave balance audit">
  <ng-template appDataTableCell="employee" let-row>{{ row.employeeName }} <span class="lba-muted">{{ row.employeeNumber }}</span></ng-template>
  <ng-template appDataTableCell="type" let-row>{{ row.leaveTypeName }}</ng-template>
  <ng-template appDataTableCell="change" let-row><span class="lba-change-type" [class]="'lba-change-' + row.changeType">{{ changeTypeLabel(row.changeType) }}</span></ng-template>
  <ng-template appDataTableCell="hours" let-row>
    <span data-testid="audit-days-changed" [class.lba-positive]="row.hoursChanged >= 0" [class.lba-negative]="row.hoursChanged < 0">{{ signedDays(row.hoursChanged) }}</span>
  </ng-template>
  <ng-template appDataTableCell="balanceAfter" let-row>{{ row.balanceAfter }}</ng-template>
  <ng-template appDataTableCell="reason" let-row>{{ row.reason ?? '-' }}</ng-template>
  <ng-template appDataTableCell="date" let-row>{{ row.createdAt | slice:0:10 }}</ng-template>
</app-data-table>
@if (hasMore) {
  <button type="button" data-testid="load-more" class="lba-load-more" [disabled]="loading" (click)="loadMoreRequested.emit()">{{ loading ? 'Loading...' : 'Load more' }}</button>
}
