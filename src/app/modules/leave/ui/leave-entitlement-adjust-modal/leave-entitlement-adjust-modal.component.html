<!-- Quiet Operations Desk: a single confirmation state makes negative balances explicit. -->
<app-modal [open]="open" title="Adjust Entitlement" (closed)="onClose()">
  <div class="eam-body">
    <p class="eam-subject">{{ entitlement.employeeName }} · {{ entitlement.leaveTypeName }} · {{ entitlement.year }}</p>
    <div class="eam-two">
      <label class="eam-field">
        <span>Total hours</span>
        <input type="number" step="0.5" [value]="totalHours()" (input)="totalHours.set($any($event.target).valueAsNumber)" />
      </label>
      <label class="eam-field">
        <span>Carried forward hours</span>
        <input type="number" step="0.5" [value]="carriedForwardHours()" (input)="carriedForwardHours.set($any($event.target).valueAsNumber)" />
      </label>
    </div>
    <label class="eam-field">
      <span>Reason</span>
      <textarea rows="2" (input)="reason.set($any($event.target).value)"></textarea>
    </label>
    @if (actionError) { <p class="eam-error">{{ actionError }}</p> }
    @if (needsConfirmation) { <p class="eam-warning">This adjustment would leave a negative remaining balance. Continue anyway?</p> }
    <div class="eam-actions">
      <button type="button" class="eam-secondary" (click)="onClose()">Cancel</button>
      @if (!needsConfirmation) {
        <button type="button" class="eam-primary" [disabled]="saving" (click)="onSubmit()">{{ saving ? 'Saving…' : 'Save adjustment' }}</button>
      } @else {
        <button type="button" data-testid="adjust-confirm-negative" class="eam-danger" [disabled]="saving" (click)="onConfirmNegative()">Adjust anyway</button>
      }
    </div>
  </div>
</app-modal>
