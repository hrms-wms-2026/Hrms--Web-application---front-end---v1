<app-data-table [columns]="columns" [rows]="requests" [trackBy]="trackById" [rowTestId]="rowTestId" caption="Leave request history">
  <ng-template appDataTableCell="type" let-request>{{ request.leaveTypeName }}</ng-template>
  <ng-template appDataTableCell="from" let-request>{{ request.startAt | date:'yyyy-MM-dd HH:mm' }}</ng-template>
  <ng-template appDataTableCell="to" let-request>{{ request.endAt | date:'yyyy-MM-dd HH:mm' }}</ng-template>
  <ng-template appDataTableCell="hours" let-request>{{ request.totalHours.toFixed(2) }}h</ng-template>
  <ng-template appDataTableCell="status" let-request><span data-testid="request-status" class="lrh-status" [class]="'lrh-status-' + request.status">{{ statusLabel(request.status) }}</span></ng-template>
  <ng-template appDataTableCell="approvedBy" let-request><span data-testid="approved-by">{{ request.approvedByName || '—' }}</span></ng-template>
  <ng-template appDataTableCell="submitted" let-request>{{ request.createdAt | slice:0:10 }}</ng-template>
  <ng-template appDataTableCell="actions" let-request>
    @if (canCancel(request)) {
      <button type="button" data-testid="cancel-request" class="lrh-cancel" (click)="cancelRequested.emit(request)">Cancel</button>
    }
  </ng-template>
</app-data-table>
