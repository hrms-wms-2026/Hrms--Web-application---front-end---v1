<section class="to-page">
  <header class="to-header">
    <app-breadcrumb-header class="to-breadcrumb" parentLabel="Time Off" currentLabel="Team Calendar" icon="time-off" />
    <h1 class="to-sr-only">Team Calendar</h1>
    <div class="to-header-actions">
      <app-select
        data-testid="calendar-department"
        [options]="departmentSelectOptions()"
        [value]="store.departmentId() ?? ''"
        (valueChange)="onDepartmentChange($event)"
      />
      <label class="to-filter">
        <input type="checkbox" data-testid="calendar-include-pending" [checked]="store.includeTentative()" (change)="store.setIncludeTentative($any($event.target).checked)" />
        Include pending
      </label>
      @if (canManageHolidays()) {
        <app-button variant="secondary" data-testid="manage-holidays" (click)="openHolidays()">Holidays</app-button>
      }
      <nav class="tc-nav" aria-label="Month">
        <button type="button" aria-label="Previous month" (click)="store.goToPreviousMonth()">‹</button>
        <button type="button" class="tc-nav__current" (click)="store.goToToday()">{{ monthLabel() || 'Today' }}</button>
        <button type="button" aria-label="Next month" (click)="store.goToNextMonth()">›</button>
      </nav>
    </div>
  </header>
  @if (store.loading()) {
    <div class="to-loading"><app-loader /></div>
  } @else if (store.error()) {
    <app-error-state [message]="store.error()!" [retryable]="true" (retry)="store.load()" />
  } @else if (store.month()?.isEmpty) {
    <div class="to-empty">
      <app-empty-state title="No leave this month" description="Nobody has approved or pending leave in this range." />
    </div>
  } @else if (store.month(); as month) {
    <app-kpi-tiles ariaLabel="Month totals" [tiles]="monthKpiTiles()" />
    <div class="to-table-card">
      <app-leave-calendar-grid [days]="month.days" (dayClicked)="onDayClicked($event)" />
    </div>
  }
</section>

<app-leave-calendar-day-detail
  [open]="detailOpen()"
  [day]="selectedDay()"
  [canRequestLeave]="canRequestLeave()"
  (requestLeave)="onRequestLeave($event)"
  (closed)="closeDetail()"
/>

@if (wizardOpen()) {
  <app-new-leave-request-wizard
    [open]="true"
    [leaveTypes]="leaveTypeStore.items()"
    [balances]="balanceStore.my()"
    [initialStartDate]="requestDate() ?? ''"
    [initialEndDate]="requestDate() ?? ''"
    [workStartTime]="balanceStore.workWindow()?.workStartTime ?? null"
    [workEndTime]="balanceStore.workWindow()?.workEndTime ?? null"
    [timezone]="balanceStore.workWindow()?.timezone ?? 'UTC'"
    [previewing]="requestStore.previewing()"
    [previewResult]="requestStore.previewResult()"
    [previewError]="requestStore.previewError()"
    [submitting]="requestStore.submitting()"
    [submitError]="requestStore.submitError()"
    [uploadedDocuments]="uploadedDocuments()"
    [uploadingDocument]="requestStore.uploadingDocument()"
    [documentUploadError]="requestStore.documentUploadError()"
    (previewRequested)="onPreviewRequested($event)"
    (submitRequested)="onSubmitRequested($event)"
    (documentSelected)="onDocumentSelected($event)"
    (documentRemoved)="onDocumentRemoved($event)"
    (closed)="closeWizard()"
  />
}

<app-leave-holiday-modal
  [open]="holidayOpen()"
  [holidays]="store.holidays()"
  [saving]="holidaySaving()"
  [actionError]="store.holidaysError()"
  (save)="onSaveHoliday($event)"
  (remove)="onRemoveHoliday($event)"
  (closed)="closeHolidays()"
/>
