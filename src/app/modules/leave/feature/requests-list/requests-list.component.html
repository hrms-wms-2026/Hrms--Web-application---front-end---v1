<section class="rl-page">
  <header class="rl-header">
    <div><p class="rl-kicker">TIME OFF / APPROVALS</p><h1>All Requests</h1><p class="rl-subtitle">Every leave request across the organization.</p></div>
  </header>
  <nav class="rl-filters">
    <button type="button" (click)="setStatusFilter(undefined)">All</button>
    <button type="button" (click)="setStatusFilter('pending')">Pending</button>
    <button type="button" (click)="setStatusFilter('approved')">Approved</button>
    <button type="button" (click)="setStatusFilter('rejected')">Rejected</button>
  </nav>
  <div class="rl-toolbar">
    <select (change)="onLeaveTypeFilterChange($any($event.target).value)">
      <option value="">All leave types</option>
      @for (type of leaveTypeStore.items(); track type.id) { <option [value]="type.id">{{ type.name }}</option> }
    </select>
    <input type="date" aria-label="From date" (change)="onFromDateChange($any($event.target).value)" />
    <input type="date" aria-label="To date" (change)="onToDateChange($any($event.target).value)" />
  </div>
  @if (store.allLoading()) {
    <div class="rl-loading" aria-busy="true"><span></span><span></span><span></span></div>
  } @else if (store.allError()) {
    <app-error-state [message]="store.allError()!" [retryable]="true" (retry)="store.loadAll()" />
  } @else if (store.all().length === 0) {
    <app-empty-state title="No leave requests found" description="No requests match the current filters." />
  } @else {
    <app-leave-request-all-table [rows]="store.all()" [timezone]="settingsStore.settings()?.timezone ?? null" (rowClicked)="onRowClicked($event)" (cancelRequested)="onCancelRequested($event)" />
  }
</section>

<app-leave-approval-detail-sheet
  [open]="detailOpen()"
  [detail]="store.detail()"
  [canApprove]="canApprove()"
  [timezone]="settingsStore.settings()?.timezone ?? null"
  [deciding]="store.deciding()"
  [decideError]="store.decideError()"
  (closed)="closeDetail()"
/>

<app-leave-cancel-confirm-dialog
  [open]="cancelTarget() !== null"
  [leaveTypeName]="cancelTarget()?.leaveTypeName ?? ''"
  [startAt]="cancelTarget()?.startAt ?? ''"
  [endAt]="cancelTarget()?.endAt ?? ''"
  [totalHours]="cancelTarget()?.totalHours ?? 0"
  [timezone]="settingsStore.settings()?.timezone ?? null"
  [status]="cancelTarget()?.status ?? ''"
  [requireReason]="true"
  [cancelling]="store.cancelling()"
  [cancelError]="store.cancelDialogError()"
  (confirmed)="onConfirmCancel($event)"
  (closed)="closeCancelDialog()"
/>
