<!-- Quiet Operations Desk: team balance lookup is simple, scoped, and high-density. -->
<section class="tbc-page"><header class="tbc-header"><div><p class="tbc-kicker">TIME OFF / TEAM</p><h1>Team Balances</h1><p class="tbc-subtitle">Leave positions for your direct and indirect reports.</p></div><input data-testid="team-balances-search" type="text" placeholder="Search name or employee number" class="tbc-search" (input)="onSearchInput($event)" /></header>@if (store.teamLoading()) { <div class="tbc-loading" aria-busy="true"><span></span><span></span><span></span></div> } @else if (store.teamError()) { <app-error-state [message]="store.teamError()!" [retryable]="true" (retry)="store.loadTeam(store.year())" /> } @else if (store.team().length === 0) { <app-empty-state title="No team balances found" description="No entitlements match the current filters, or your team has none generated yet." /> } @else { <app-leave-balance-list-table [balances]="store.team()" [showDepartmentColumn]="true" /> }</section>
