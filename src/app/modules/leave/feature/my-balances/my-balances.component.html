<!-- Quiet Operations Desk: personal balances lead the Time Off module without management noise. -->
<section class="mbc-page"><header class="mbc-header"><div><p class="mbc-kicker">TIME OFF</p><h1>My Balances</h1><p class="mbc-subtitle">Your leave entitlement and remaining days for the selected year.</p></div><app-select [options]="yearOptions" [value]="selectedYear()" (valueChange)="onYearChange($event)" /></header>@if (store.myLoading()) { <div class="mbc-loading" aria-busy="true"><span></span><span></span><span></span></div> } @else if (store.myError()) { <app-error-state [message]="store.myError()!" [retryable]="true" (retry)="store.loadMy(store.year())" /> } @else if (store.my().length === 0) { <app-empty-state title="No leave balances yet" description="Balances appear once HR generates entitlements for this year." /> } @else { <app-leave-balance-list-table [balances]="store.my()" [showEmployeeColumn]="false" /> }</section>
