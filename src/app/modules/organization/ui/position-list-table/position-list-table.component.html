<app-data-table
  [columns]="columns()"
  [rows]="positions"
  [filterValues]="filterValues()"
  (filterChanged)="filterChanged.emit($event)"
  [trackBy]="trackById"
  [rowClass]="rowClass"
  [rowTitle]="vacancyTitle"
  [rowMuted]="isArchived"
  caption="Positions"
  emptyMessage="No positions found."
>
  <ng-template appDataTableCell="name" let-pos><span class="plt-name">{{ pos.name }}</span></ng-template>
  <ng-template appDataTableCell="code" let-pos>
    @if (pos.code) {
      <span class="plt-code-chip">{{ pos.code }}</span>
    } @else {
      <span class="plt-text-secondary">—</span>
    }
  </ng-template>
  <ng-template appDataTableCell="department" let-pos>{{ pos.departmentName || getDepartmentName(pos.departmentId) }}</ng-template>
  <ng-template appDataTableCell="reportsTo" let-pos><span class="plt-text-secondary">{{ pos.reportsToPositionName || getReportsToName(pos.reportsToPositionId) }}</span></ng-template>
  <ng-template appDataTableCell="capacity" let-pos>
    <app-position-seat-preview
      [assignedCount]="pos.assignedCount ?? 0"
      [maxOccupancy]="pos.maxOccupancy"
      [occupantPreview]="pos.occupantPreview ?? []"
      [remainingAssignedCount]="pos.remainingAssignedCount ?? 0"
    />
  </ng-template>
  <ng-template appDataTableCell="actions" let-pos>
    <div class="plt-action-wrapper">
      <button
        type="button"
        class="plt-action-btn"
        (click)="openPositionPanel(pos, $event)"
        aria-label="Open position details"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1" />
          <circle cx="12" cy="5" r="1" />
          <circle cx="12" cy="19" r="1" />
        </svg>
      </button>
    </div>
  </ng-template>
</app-data-table>
