<app-archive-confirm-modal
  entityType="role"
  [entityName]="role().name"
  subtitle="This soft-archives the custom role. Users assigned to this role may lose associated permissions."
  [saving]="saving()"
  warningMessage="Archiving this role will prevent it from being assigned to any new users. Historical audit trails and existing session permissions will be handled according to tenant access policies."
  (confirmed)="confirmArchive.emit()"
  (cancelled)="cancelled.emit()"
/>
