<app-data-table
  [columns]="columns"
  [rows]="departments"
  [trackBy]="trackById"
  [rowMuted]="isArchived"
  caption="Departments"
  emptyMessage="No departments found."
>
  <ng-template appDataTableCell="name" let-dept><span class="dlt-name">{{ dept.name }}</span></ng-template>
  <ng-template appDataTableCell="code" let-dept><span class="dlt-code-chip">{{ dept.code }}</span></ng-template>
  <ng-template appDataTableCell="head" let-dept><span class="dlt-text-secondary">{{ dept.headPositionTitle || 'Vacant' }}</span></ng-template>
  <ng-template appDataTableCell="positions" let-dept>{{ dept.positionCount ?? 0 }}</ng-template>
  <ng-template appDataTableCell="employees" let-dept>{{ dept.employeeCount ?? 0 }}</ng-template>
  <ng-template appDataTableCell="status" let-dept>
    @if (dept.isActive) {
      <span class="dlt-badge dlt-badge--active">Active</span>
    } @else {
      <span class="dlt-badge dlt-badge--inactive">Archived</span>
    }
  </ng-template>
  <ng-template appDataTableCell="actions" let-dept>
    <div class="dlt-action-wrapper">
      <button
        type="button"
        class="dlt-action-btn"
        (click)="toggleMenu(dept.id, $event)"
        aria-label="Actions"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1" />
          <circle cx="12" cy="5" r="1" />
          <circle cx="12" cy="19" r="1" />
        </svg>
      </button>

      @if (openMenuId() === dept.id) {
        <div class="dlt-menu" appStopClickPropagation>
          <button type="button" class="dlt-menu-item" (click)="onEdit(dept, $event)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Edit
          </button>
          @if (dept.isActive) {
            <button type="button" class="dlt-menu-item dlt-menu-item--danger" (click)="onArchive(dept, $event)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Archive
            </button>
          } @else {
            <button type="button" class="dlt-menu-item" (click)="onRestore(dept, $event)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              Restore
            </button>
          }
        </div>
      }
    </div>
  </ng-template>
</app-data-table>
