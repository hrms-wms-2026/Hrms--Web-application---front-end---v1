<app-archive-confirm-modal
  entityType="department"
  [entityName]="department().name"
  subtitle="This removes the department from the active organisation structure."
  [checking]="checking()"
  [saving]="saving()"
  [impacts]="impacts()"
  [canArchive]="dependency()?.canArchive ?? false"
  [blockerMessages]="dependency()?.blockerMessages ?? []"
  clearMessage="No active employees, positions, or subdepartments are linked to this department. Historical records and audit history will remain available."
  (confirmed)="confirmArchive.emit()"
  (cancelled)="cancelled.emit()"
/>
