<app-data-table
  [columns]="columns"
  [rows]="roles"
  [trackBy]="trackById"
  caption="Roles"
  emptyMessage="No roles found."
  [rowClickable]="true"
  [rowFocusable]="true"
  (rowClicked)="openRole.emit($event)"
>
  <ng-template appDataTableCell="name" let-role><span class="rlt-name">{{ role.name }}</span></ng-template>
  <ng-template appDataTableCell="description" let-role><span class="rlt-desc">{{ role.description || 'No description provided.' }}</span></ng-template>
  <ng-template appDataTableCell="type" let-role>
    @if (role.isSystem) {
      <span class="rlt-badge rlt-badge--system">System Role</span>
    } @else {
      <span class="rlt-badge rlt-badge--custom">Custom Role</span>
    }
  </ng-template>
  <ng-template appDataTableCell="permissions" let-role>
    <span class="rlt-perm-count">{{ role.permissionCount }} {{ role.permissionCount === 1 ? 'permission' : 'permissions' }}</span>
  </ng-template>
  <ng-template appDataTableCell="actions" let-role>
    <div class="rlt-actions">
      @if (role.isSystem) {
        <button
          type="button"
          class="rlt-action-btn"
          title="View permissions"
          [attr.aria-label]="'View permissions for ' + role.name"
          (click)="openRole.emit(role)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
      } @else {
        <button
          type="button"
          class="rlt-action-btn"
          title="Edit role"
          [attr.aria-label]="'Edit ' + role.name"
          (click)="openRole.emit(role)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button
          type="button"
          class="rlt-action-btn rlt-action-btn--danger"
          title="Archive"
          [attr.aria-label]="'Archive ' + role.name"
          (click)="archiveRole.emit(role)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      }
    </div>
  </ng-template>
</app-data-table>
