<app-archive-confirm-modal
  entityType="position"
  [entityName]="position().name"
  subtitle="Deactivates the position from active organisation reporting structures."
  [checking]="checking()"
  [saving]="saving()"
  [impacts]="impacts()"
  [canArchive]="blockers()?.canArchive ?? false"
  [blockerMessages]="blockerMessages()"
  clearMessage="No active child positions or Department Head assignments are linked to this position. Historical records remain preserved."
  [bodyScrollFade]="true"
  (confirmed)="confirmArchive.emit()"
  (cancelled)="cancelled.emit()"
/>
