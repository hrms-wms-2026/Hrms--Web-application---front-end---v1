<div class="flex flex-col gap-2.5">
  @if (store.error(); as err) {
    <div class="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-lg p-2.5">
      {{ err }}
    </div>
  }

  @for (mode of store.items(); track mode.id) {
    <div
      data-testid="work-mode-row"
      class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] px-3.5 py-3 shadow-xs hover:border-slate-300 transition-colors"
    >
      <div class="flex items-center justify-between gap-3 mb-2.5">
        <div class="flex items-center gap-2 min-w-0">
          <span class="work-mode-row__name font-semibold text-xs text-[var(--color-text-primary)] truncate">
            {{ mode.name }}
          </span>
          @if (mode.isSystemSeeded) {
            <span class="work-mode-row__badge inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wider bg-[var(--color-surface-secondary)] text-[var(--color-text-secondary)] border border-[var(--color-border)]">
              Default
            </span>
          }
        </div>

        @if (canEdit()) {
          <button
            type="button"
            class="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium text-rose-600 hover:text-rose-700 hover:bg-rose-50 rounded transition-colors cursor-pointer"
            data-testid="deactivate-work-mode"
            [disabled]="store.saving()"
            (click)="deactivate(mode.id, mode.name)"
            title="Delete work mode"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>Delete</span>
          </button>
        }
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
        <!-- Biometric -->
        <label
          class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border transition-all select-none cursor-pointer"
          [class.border-blue-500]="mode.biometricEnabled"
          [class.bg-blue-50\/50]="mode.biometricEnabled"
          [class.border-[var(--color-border)]]="!mode.biometricEnabled"
          [class.bg-[var(--color-surface)]]="!mode.biometricEnabled"
          [class.hover:bg-[var(--color-surface-secondary)]]="!mode.biometricEnabled"
          [class.opacity-60]="!canEdit() || store.saving()"
          [class.cursor-not-allowed]="!canEdit() || store.saving()"
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded flex items-center justify-center shrink-0 transition-colors"
              [class.bg-blue-100]="mode.biometricEnabled"
              [class.text-blue-600]="mode.biometricEnabled"
              [class.bg-[var(--color-surface-secondary)]]="!mode.biometricEnabled"
              [class.text-[var(--color-text-secondary)]]="!mode.biometricEnabled"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004.07 9m4.93 11a11.96 11.96 0 01-1.748-4.878" />
              </svg>
            </div>
            <span
              class="text-xs font-medium truncate"
              [class.text-[var(--color-text-primary)]]="mode.biometricEnabled"
              [class.font-semibold]="mode.biometricEnabled"
              [class.text-[var(--color-text-secondary)]]="!mode.biometricEnabled"
            >
              Biometric
            </span>
          </div>

          <span class="relative inline-flex items-center shrink-0">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="mode.biometricEnabled"
              [disabled]="!canEdit() || store.saving()"
              (change)="save(mode.id, { name: mode.name, biometricEnabled: $any($event.target).checked, webEnabled: mode.webEnabled, trayEnabled: mode.trayEnabled, photoRequired: mode.photoRequired, selfRegistersLocation: mode.selfRegistersLocation, allowsDailyLocationChoice: mode.allowsDailyLocationChoice })"
            />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

        <!-- Web/app -->
        <label
          class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border transition-all select-none cursor-pointer"
          [class.border-blue-500]="mode.webEnabled"
          [class.bg-blue-50\/50]="mode.webEnabled"
          [class.border-[var(--color-border)]]="!mode.webEnabled"
          [class.bg-[var(--color-surface)]]="!mode.webEnabled"
          [class.hover:bg-[var(--color-surface-secondary)]]="!mode.webEnabled"
          [class.opacity-60]="!canEdit() || store.saving()"
          [class.cursor-not-allowed]="!canEdit() || store.saving()"
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded flex items-center justify-center shrink-0 transition-colors"
              [class.bg-blue-100]="mode.webEnabled"
              [class.text-blue-600]="mode.webEnabled"
              [class.bg-[var(--color-surface-secondary)]]="!mode.webEnabled"
              [class.text-[var(--color-text-secondary)]]="!mode.webEnabled"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
              </svg>
            </div>
            <span
              class="text-xs font-medium truncate"
              [class.text-[var(--color-text-primary)]]="mode.webEnabled"
              [class.font-semibold]="mode.webEnabled"
              [class.text-[var(--color-text-secondary)]]="!mode.webEnabled"
            >
              Web/app
            </span>
          </div>

          <span class="relative inline-flex items-center shrink-0">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="mode.webEnabled"
              [disabled]="!canEdit() || store.saving()"
              (change)="save(mode.id, { name: mode.name, biometricEnabled: mode.biometricEnabled, webEnabled: $any($event.target).checked, trayEnabled: mode.trayEnabled, photoRequired: mode.photoRequired, selfRegistersLocation: mode.selfRegistersLocation, allowsDailyLocationChoice: mode.allowsDailyLocationChoice })"
            />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

        <!-- Desktop tray -->
        <label
          class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border transition-all select-none cursor-pointer"
          [class.border-blue-500]="mode.trayEnabled"
          [class.bg-blue-50\/50]="mode.trayEnabled"
          [class.border-[var(--color-border)]]="!mode.trayEnabled"
          [class.bg-[var(--color-surface)]]="!mode.trayEnabled"
          [class.hover:bg-[var(--color-surface-secondary)]]="!mode.trayEnabled"
          [class.opacity-60]="!canEdit() || store.saving()"
          [class.cursor-not-allowed]="!canEdit() || store.saving()"
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded flex items-center justify-center shrink-0 transition-colors"
              [class.bg-blue-100]="mode.trayEnabled"
              [class.text-blue-600]="mode.trayEnabled"
              [class.bg-[var(--color-surface-secondary)]]="!mode.trayEnabled"
              [class.text-[var(--color-text-secondary)]]="!mode.trayEnabled"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"></rect>
                <line x1="8" y1="21" x2="16" y2="21" stroke-linecap="round" stroke-linejoin="round"></line>
                <line x1="12" y1="17" x2="12" y2="21" stroke-linecap="round" stroke-linejoin="round"></line>
              </svg>
            </div>
            <span
              class="text-xs font-medium truncate"
              [class.text-[var(--color-text-primary)]]="mode.trayEnabled"
              [class.font-semibold]="mode.trayEnabled"
              [class.text-[var(--color-text-secondary)]]="!mode.trayEnabled"
            >
              Desktop tray
            </span>
          </div>

          <span class="relative inline-flex items-center shrink-0">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="mode.trayEnabled"
              [disabled]="!canEdit() || store.saving()"
              (change)="save(mode.id, { name: mode.name, biometricEnabled: mode.biometricEnabled, webEnabled: mode.webEnabled, trayEnabled: $any($event.target).checked, photoRequired: mode.photoRequired, selfRegistersLocation: mode.selfRegistersLocation, allowsDailyLocationChoice: mode.allowsDailyLocationChoice })"
            />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

        <!-- Photo required -->
        <label
          class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border transition-all select-none cursor-pointer"
          [class.border-blue-500]="mode.photoRequired"
          [class.bg-blue-50\/50]="mode.photoRequired"
          [class.border-[var(--color-border)]]="!mode.photoRequired"
          [class.bg-[var(--color-surface)]]="!mode.photoRequired"
          [class.hover:bg-[var(--color-surface-secondary)]]="!mode.photoRequired"
          [class.opacity-60]="!canEdit() || store.saving()"
          [class.cursor-not-allowed]="!canEdit() || store.saving()"
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded flex items-center justify-center shrink-0 transition-colors"
              [class.bg-blue-100]="mode.photoRequired"
              [class.text-blue-600]="mode.photoRequired"
              [class.bg-[var(--color-surface-secondary)]]="!mode.photoRequired"
              [class.text-[var(--color-text-secondary)]]="!mode.photoRequired"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <circle cx="12" cy="13" r="4" stroke-linecap="round" stroke-linejoin="round"></circle>
              </svg>
            </div>
            <span
              class="text-xs font-medium truncate"
              [class.text-[var(--color-text-primary)]]="mode.photoRequired"
              [class.font-semibold]="mode.photoRequired"
              [class.text-[var(--color-text-secondary)]]="!mode.photoRequired"
            >
              Photo required
            </span>
          </div>

          <span class="relative inline-flex items-center shrink-0">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="mode.photoRequired"
              [disabled]="!canEdit() || store.saving()"
              (change)="save(mode.id, { name: mode.name, biometricEnabled: mode.biometricEnabled, webEnabled: mode.webEnabled, trayEnabled: mode.trayEnabled, photoRequired: $any($event.target).checked, selfRegistersLocation: mode.selfRegistersLocation, allowsDailyLocationChoice: mode.allowsDailyLocationChoice })"
            />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

        <!-- Self-registers location -->
        <label
          class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border transition-all select-none cursor-pointer"
          [class.border-blue-500]="mode.selfRegistersLocation"
          [class.bg-blue-50\/50]="mode.selfRegistersLocation"
          [class.border-[var(--color-border)]]="!mode.selfRegistersLocation"
          [class.bg-[var(--color-surface)]]="!mode.selfRegistersLocation"
          [class.hover:bg-[var(--color-surface-secondary)]]="!mode.selfRegistersLocation"
          [class.opacity-60]="!canEdit() || store.saving()"
          [class.cursor-not-allowed]="!canEdit() || store.saving()"
          title="First clock-in registers the employee's home location, instead of checking against the office."
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded flex items-center justify-center shrink-0 transition-colors"
              [class.bg-blue-100]="mode.selfRegistersLocation"
              [class.text-blue-600]="mode.selfRegistersLocation"
              [class.bg-[var(--color-surface-secondary)]]="!mode.selfRegistersLocation"
              [class.text-[var(--color-text-secondary)]]="!mode.selfRegistersLocation"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <circle cx="12" cy="11" r="3" stroke-linecap="round" stroke-linejoin="round"></circle>
              </svg>
            </div>
            <span
              class="text-xs font-medium truncate"
              [class.text-[var(--color-text-primary)]]="mode.selfRegistersLocation"
              [class.font-semibold]="mode.selfRegistersLocation"
              [class.text-[var(--color-text-secondary)]]="!mode.selfRegistersLocation"
            >
              Work from home
            </span>
          </div>

          <span class="relative inline-flex items-center shrink-0">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="mode.selfRegistersLocation"
              [disabled]="!canEdit() || store.saving()"
              (change)="save(mode.id, setLocationBehavior(mode, 'selfRegistersLocation', $any($event.target).checked))"
            />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

        <!-- Allows daily location choice -->
        <label
          class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border transition-all select-none cursor-pointer"
          [class.border-blue-500]="mode.allowsDailyLocationChoice"
          [class.bg-blue-50\/50]="mode.allowsDailyLocationChoice"
          [class.border-[var(--color-border)]]="!mode.allowsDailyLocationChoice"
          [class.bg-[var(--color-surface)]]="!mode.allowsDailyLocationChoice"
          [class.hover:bg-[var(--color-surface-secondary)]]="!mode.allowsDailyLocationChoice"
          [class.opacity-60]="!canEdit() || store.saving()"
          [class.cursor-not-allowed]="!canEdit() || store.saving()"
          title="Employee picks office, home, or other location before clocking in each day."
        >
          <div class="flex items-center gap-2 min-w-0">
            <div
              class="w-6 h-6 rounded flex items-center justify-center shrink-0 transition-colors"
              [class.bg-blue-100]="mode.allowsDailyLocationChoice"
              [class.text-blue-600]="mode.allowsDailyLocationChoice"
              [class.bg-[var(--color-surface-secondary)]]="!mode.allowsDailyLocationChoice"
              [class.text-[var(--color-text-secondary)]]="!mode.allowsDailyLocationChoice"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" stroke-linecap="round" stroke-linejoin="round"></rect>
                <line x1="16" y1="2" x2="16" y2="6" stroke-linecap="round" stroke-linejoin="round"></line>
                <line x1="8" y1="2" x2="8" y2="6" stroke-linecap="round" stroke-linejoin="round"></line>
                <line x1="3" y1="10" x2="21" y2="10" stroke-linecap="round" stroke-linejoin="round"></line>
              </svg>
            </div>
            <span
              class="text-xs font-medium truncate"
              [class.text-[var(--color-text-primary)]]="mode.allowsDailyLocationChoice"
              [class.font-semibold]="mode.allowsDailyLocationChoice"
              [class.text-[var(--color-text-secondary)]]="!mode.allowsDailyLocationChoice"
            >
              Flexible daily location
            </span>
          </div>

          <span class="relative inline-flex items-center shrink-0">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="mode.allowsDailyLocationChoice"
              [disabled]="!canEdit() || store.saving()"
              (change)="save(mode.id, setLocationBehavior(mode, 'allowsDailyLocationChoice', $any($event.target).checked))"
            />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>
      </div>
    </div>
  }

  @if (addingNew) {
    <div class="rounded-xl border border-dashed border-blue-400 bg-blue-50/30 px-3.5 py-3">
      <div class="flex items-center justify-between gap-3 mb-2.5 flex-wrap">
        <div class="flex items-center gap-2 flex-1 min-w-[180px]">
          <input
            type="text"
            class="ui-input ui-input--sm max-w-xs"
            [(ngModel)]="draft.name"
            (ngModelChange)="changed.emit()"
            placeholder="Work mode name (e.g. Contractors)"
            autofocus
          />
        </div>
        <div class="flex items-center gap-1.5">
          <button
            type="button"
            class="px-2.5 py-1 text-xs font-medium text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-secondary)] rounded transition cursor-pointer"
            (click)="cancelAdd()"
          >
            Cancel
          </button>
          <button
            type="button"
            class="px-3 py-1 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded transition cursor-pointer"
            [disabled]="!draft.name.trim() || store.saving()"
            (click)="confirmAdd()"
          >
            Add mode
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
        <label class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] cursor-pointer select-none" [class.border-blue-500]="draft.biometricEnabled" [class.bg-blue-50\/50]="draft.biometricEnabled">
          <div class="flex items-center gap-2 min-w-0">
            <div class="w-6 h-6 rounded flex items-center justify-center shrink-0 bg-[var(--color-surface-secondary)] text-[var(--color-text-secondary)]" [class.bg-blue-100]="draft.biometricEnabled" [class.text-blue-600]="draft.biometricEnabled">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004.07 9m4.93 11a11.96 11.96 0 01-1.748-4.878" />
              </svg>
            </div>
            <span class="text-xs font-medium truncate text-[var(--color-text-primary)]">Biometric</span>
          </div>
          <span class="relative inline-flex items-center shrink-0">
            <input type="checkbox" class="sr-only peer" [(ngModel)]="draft.biometricEnabled" (ngModelChange)="changed.emit()" />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

        <label class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] cursor-pointer select-none" [class.border-blue-500]="draft.webEnabled" [class.bg-blue-50\/50]="draft.webEnabled">
          <div class="flex items-center gap-2 min-w-0">
            <div class="w-6 h-6 rounded flex items-center justify-center shrink-0 bg-[var(--color-surface-secondary)] text-[var(--color-text-secondary)]" [class.bg-blue-100]="draft.webEnabled" [class.text-blue-600]="draft.webEnabled">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
              </svg>
            </div>
            <span class="text-xs font-medium truncate text-[var(--color-text-primary)]">Web/app</span>
          </div>
          <span class="relative inline-flex items-center shrink-0">
            <input type="checkbox" class="sr-only peer" [(ngModel)]="draft.webEnabled" (ngModelChange)="changed.emit()" />
            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>
          </span>
        </label>

            <span class="w-7 h-4 bg-slate-200 peer-focus:outline-none peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 rounded-full transition-colors"></span>

  @if (canEdit()) {
    <div class="flex">
      <button
        type="button"
        class="w-full flex items-center justify-center gap-1.5 py-2 px-3 text-xs font-medium text-[var(--color-text-secondary)] hover:text-blue-600 bg-[var(--color-surface)] hover:bg-blue-50/40 border border-dashed border-[var(--color-border)] hover:border-blue-400 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
        data-testid="add-work-mode"
        [disabled]="store.atCap() || store.saving()"
        (click)="startAdd()"
      >
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span>Add work mode {{ store.atCap() ? '(maximum of 5 reached)' : '' }}</span>

</div>
