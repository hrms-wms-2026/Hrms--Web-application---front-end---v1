<form [formGroup]="form" (ngSubmit)="onSubmit()" class="pf-form">
  @if (saveError()) {
    <div class="pf-error-banner" role="alert">{{ saveError() }}</div>
  }

  <section class="pf-section">
    <h3 class="pf-section__title">Profile photo</h3>
    <div class="pf-avatar-row">
      <app-avatar
        [avatarUrl]="avatarUrl()"
        [userName]="displayName()"
        [email]="personalInformation().email"
        size="lg"
      />
      <label class="pf-upload-btn">
        Change photo
        <input type="file" accept="image/*" (change)="onAvatarFileSelected($event)" />
      </label>
    </div>
  </section>

  <section class="pf-section">
    <h3 class="pf-section__title">Basic details</h3>
    <div class="pf-field-grid pf-field-grid--2">
      <app-input
        label="First name"
        [value]="form.controls.firstName.value"
        (valueChange)="form.controls.firstName.setValue($event)"
        (blurred)="form.controls.firstName.markAsTouched()"
        [error]="form.controls.firstName.touched && form.controls.firstName.invalid ? 'First name is required.' : ''"
      />
      <app-input
        label="Last name"
        [value]="form.controls.lastName.value"
        (valueChange)="form.controls.lastName.setValue($event)"
        (blurred)="form.controls.lastName.markAsTouched()"
        [error]="form.controls.lastName.touched && form.controls.lastName.invalid ? 'Last name is required.' : ''"
      />
      <app-input
        label="Mobile number"
        type="tel"
        [value]="form.controls.phone.value"
        (valueChange)="form.controls.phone.setValue($event)"
        [error]="!isPhoneValid() ? 'Please enter a valid phone number.' : ''"
      />
      <app-date-picker
        label="Date of birth"
        placeholder="YYYY-MM-DD"
        [value]="form.controls.dateOfBirth.value || ''"
        (valueChange)="form.controls.dateOfBirth.setValue($event)"
      />
      <app-select
        label="Gender"
        placeholder="Prefer not to say"
        [options]="genderOptions"
        [value]="form.controls.gender.value"
        (valueChange)="form.controls.gender.setValue($event)"
      />
      <app-select
        label="Display timezone"
        placeholder="Select a timezone"
        [options]="timezoneOptions"
        [value]="form.controls.displayTimezone.value"
        (valueChange)="form.controls.displayTimezone.setValue($event)"
      />
    </div>
  </section>

  <div class="pf-actions">
    <app-button type="submit" [loading]="saving()" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save changes' }}
    </app-button>
  </div>
</form>
