<div class="adc-chart" role="img" [attr.aria-label]="summary()" data-testid="attendance-day-chart">
  @for (bar of bars(); track bar.date) {
    <div class="adc-col" [title]="bar.tooltip" data-testid="day-bar">
      <div class="adc-track">
        @for (seg of bar.segments; track seg.kind) {
          <div [class]="'adc-seg adc-seg--' + seg.kind" [attr.data-segment]="seg.kind" [style.height.%]="seg.height"></div>
        }
      </div>
      <span class="adc-label" data-testid="day-label">{{ bar.label }}</span>
    </div>
  }
</div>
