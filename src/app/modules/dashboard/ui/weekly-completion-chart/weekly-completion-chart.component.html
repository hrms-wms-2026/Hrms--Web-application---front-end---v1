<div class="wc-chart" [class.wc-chart--line]="percentPoints().length > 0" role="img" [attr.aria-label]="summary()" data-testid="weekly-completion-chart">
  @for (bar of bars(); track bar.key) {
    <div class="wc-col" [title]="bar.tooltip" data-testid="weekly-completion-bar">
      @if (!compact()) {
        <span class="wc-value" [class.wc-value--zero]="bar.height === 0">{{ bar.hoursText }}</span>
      }
      <div class="wc-track">
        <div class="wc-bar" [class.wc-bar--current]="bar.current" [style.height.%]="bar.height"></div>
      </div>
      <span class="wc-label" [class.wc-label--current]="bar.current">{{ bar.label }}</span>
    </div>
  }
  @if (percentPoints().length > 0) {
    <svg class="wc-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" data-testid="weekly-completion-line">
      <polyline [attr.points]="percentPolyline()" />
      @for (p of percentPoints(); track p.x) {
        <circle data-testid="weekly-completion-point" [attr.cx]="p.x" [attr.cy]="p.y" r="1.6" />
      }
    </svg>
    <span class="wc-axis" aria-hidden="true" data-testid="weekly-completion-axis"><span>100%</span><span>50%</span><span>0%</span></span>
  }
</div>
@if (total() === 0) {
  <p class="wc-empty" data-testid="weekly-completion-empty">No tasks completed in these weeks</p>
}
