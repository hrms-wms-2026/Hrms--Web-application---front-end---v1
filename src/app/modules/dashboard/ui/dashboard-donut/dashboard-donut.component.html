<svg viewBox="0 0 42 42" class="dd-svg" [class.dd-svg--hover]="activeSlice() !== null" role="img" [attr.aria-label]="ariaLabel()">
  <circle cx="21" cy="21" r="15.9155" fill="none" class="dd-track" [attr.stroke-width]="strokeWidth()" />
  @for (arc of arcs(); track arc.key) {
    <circle
      class="dd-arc"
      [class.dd-arc--on]="activeSlice()?.key === arc.key"
      data-testid="donut-segment"
      [attr.data-key]="arc.key"
      cx="21"
      cy="21"
      r="15.9155"
      fill="none"
      [attr.stroke-width]="strokeWidth()"
      [attr.stroke]="arc.color"
      [attr.stroke-dasharray]="arc.length + ' ' + (100 - arc.length)"
      [attr.stroke-dashoffset]="arc.offset"
      (mouseenter)="active.set(arc.key)"
    />
  }
</svg>
@if (activeSlice(); as s) {
  <!-- A lit slice takes the centre: its value, name and share. -->
  <p class="dd-center" data-testid="donut-hover">
    <span class="dd-value" [style.font-size.px]="valueFontPx(valueText(s))">{{ valueText(s) }}</span>
    <span class="dd-caption">{{ s.label }} · {{ share(s) }}</span>
  </p>
} @else {
  <!-- The widget's own centre, over the ring; it never takes the pointer, so the slices stay hoverable. -->
  <div class="dd-slot">
    <ng-content />
  </div>
}
