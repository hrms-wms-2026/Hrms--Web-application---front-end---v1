<div class="dw-legend" aria-hidden="true">
  @if (showScheduled()) {
    <span class="dw-key"><span class="dw-dot dw-dot--scheduled"></span>Scheduled</span>
  }
  <span class="dw-key"><span class="dw-dot dw-dot--worked"></span>Worked</span>
  <span class="dw-key"><span class="dw-dash"></span>Expected</span>
</div>

<div class="dw-plot" role="img" [attr.aria-label]="summary()" data-testid="daily-work-chart">
  @if (!compact()) {
    <div class="dw-axis" data-testid="daily-work-axis">
      @for (label of axisLabels(); track $index) {
        <span>{{ label }}</span>
      }
    </div>
  }
  <div class="dw-area">
    <div class="dw-tracks">
      @for (col of columns(); track col.key) {
        <div class="dw-track" [title]="col.tooltip">
          @if (showScheduled()) {
            <div class="dw-bar dw-bar--scheduled" [style.height.%]="col.scheduledHeight" data-testid="daily-work-scheduled"></div>
          }
          <div class="dw-bar dw-bar--worked" [style.height.%]="col.workedHeight" data-testid="daily-work-worked"></div>
        </div>
      }
      <svg class="dw-expected" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline [attr.points]="expectedPoints()" data-testid="daily-work-expected-line" />
      </svg>
    </div>
    <div class="dw-labels">
      @for (col of columns(); track col.key) {
        <div class="dw-label" data-testid="daily-work-day">
          <span class="dw-label-name">{{ col.name }}</span>
          @if (!compact()) {
            <span class="dw-label-hours">{{ col.hoursText }}</span>
          }
        </div>
      }
    </div>
  </div>
</div>
