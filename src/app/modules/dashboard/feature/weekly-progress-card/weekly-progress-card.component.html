<section class="flex h-full flex-col rounded-2xl border border-slate-200/80 bg-white p-5 shadow-xs" data-purpose="weekly-progress">
  <h2 class="flex items-center gap-2.5 text-base font-bold text-slate-900">
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-blue-600">
      <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="13" width="4" height="7" rx="1"></rect>
        <rect x="10" y="9" width="4" height="11" rx="1"></rect>
        <rect x="16" y="5" width="4" height="15" rx="1"></rect>
      </svg>
    </span>
    <span class="truncate">Weekly Task Progress</span>
  </h2>

  <div class="flex min-h-0 flex-1 items-center justify-center py-3">
    @if (failed()) {
      <p class="text-sm text-slate-500" data-testid="weekly-progress-error">Couldn't load this week's hours.</p>
    } @else {
      <div class="relative aspect-square h-40 max-h-full max-w-full xl:h-full xl:max-h-56" data-testid="weekly-progress-ring">
        <svg class="block h-full w-full -rotate-90" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#eef2f7" stroke-width="12" />
          @if (percent() > 0) {
            <circle
              cx="60"
              cy="60"
              r="50"
              fill="none"
              stroke="#2563eb"
              stroke-width="12"
              stroke-linecap="round"
              [attr.stroke-dasharray]="ringDash()"
              data-testid="weekly-progress-arc"
            />
          }
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <span class="text-2xl font-bold text-slate-900" data-testid="weekly-progress-hours">{{ workedLabel() }} / {{ targetLabel() }}</span>
          <span class="mt-1 text-xs text-slate-500">This week</span>
          <span class="text-xs font-medium text-slate-500" data-testid="weekly-progress-percent">{{ percent() }}%</span>
        </div>
      </div>
    }
  </div>
</section>
