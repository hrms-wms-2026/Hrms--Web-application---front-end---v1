<section class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-xs" data-testid="priority-actions-card">
  <div class="mb-4">
    <h2 class="text-sm font-bold text-slate-800">Priority Actions</h2>
    <p class="text-xs text-slate-400">What to look at first</p>
  </div>

  @if (siblingsLoading()) {
    <div class="flex flex-col gap-2" data-testid="priority-actions-skeleton">
      @for (i of [1, 2, 3]; track i) {
        <div class="h-9 animate-pulse rounded-lg bg-slate-100"></div>
      }
    </div>
  } @else if (siblingsErrored()) {
    <app-error-state message="Couldn't load priority actions." [retryable]="true" (retry)="retry()" />
  } @else if (items().length === 0) {
    <app-empty-state title="You're all caught up" />
  } @else {
    <ul class="flex flex-col gap-1" data-testid="priority-actions-list">
      @for (item of items(); track item.group + ':' + item.sourceKey + ':' + item.entityId) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-2.5 rounded-lg px-2 py-2 text-left hover:bg-slate-50"
            (click)="open(item)"
          >
            <span class="priority-action-dot" [ngClass]="dotClass(item)"></span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm text-slate-700">
                {{ item.title }}
                @if (item.subjectName) {
                  <span class="text-slate-400">· {{ item.subjectName }}</span>
                }
              </span>
            </span>
            <span class="shrink-0 text-[11px] text-slate-400">{{ item.captionLabel }}</span>
          </button>
        </li>
      }
    </ul>
  }
</section>
