<div data-testid="my-team-page">
  <app-dashboard-shell dashboardKey="my-team">
    <app-empty-state
      emptyState
      data-testid="my-team-empty"
      title="No team to show yet"
      description="Team cards appear here once you lead a team or lead work."
    />
    <app-empty-state
      retryState
      title="Couldn't load your team"
      description="Something went wrong while checking your team access. Please try again."
    >
      <button type="button" class="mt-2 text-sm font-semibold text-[var(--color-accent)] hover:underline" data-testid="my-team-retry" (click)="retry()">
        Try again
      </button>
    </app-empty-state>
  </app-dashboard-shell>
</div>
