<section
  #card
  class="qa-card flex h-full flex-col justify-center rounded-2xl border border-[var(--color-border)]/80 bg-[var(--color-surface)] px-3 py-2.5 shadow-xs"
  data-purpose="quick-actions"
  aria-labelledby="quick-actions-heading"
>
  <div #content>
    <h2 id="quick-actions-heading" class="mb-1.5 text-xs font-bold text-[var(--color-text-primary)]">Quick Actions</h2>
    <ul #list class="qa-list" role="list">
      @for (action of actions(); track action.id) {
        <li>
          <ng-template #tileBody>
            <span class="qa-icon" aria-hidden="true">
              @if (action.busy) {
                <span class="qa-spinner"></span>
              } @else {
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  @for (d of action.iconPaths; track $index) {
                    <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                  }
                </svg>
              }
            </span>
            <span class="qa-label" [attr.data-testid]="'quick-action-' + action.id + '-label'">
              {{ action.busy ? action.busyLabel : action.label }}
            </span>
          </ng-template>

          @if (action.route) {
            <a class="qa-btn" [attr.data-tone]="action.tone" [attr.data-testid]="'quick-action-' + action.id" [routerLink]="action.route">
              <ng-container [ngTemplateOutlet]="tileBody" />
            </a>
          } @else {
            <button
              type="button"
              class="qa-btn"
              [attr.data-tone]="action.tone"
              [attr.data-testid]="'quick-action-' + action.id"
              [attr.aria-busy]="action.busy ? true : null"
              [disabled]="action.disabled || action.busy"
              (click)="action.run?.()"
            >
              <ng-container [ngTemplateOutlet]="tileBody" />
            </button>
          }
        </li>
      }
    </ul>
  </div>
</section>
