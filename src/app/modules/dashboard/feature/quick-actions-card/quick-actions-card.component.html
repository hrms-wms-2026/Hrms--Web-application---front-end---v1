<section class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-xs" data-purpose="quick-actions">
  <h2 class="text-sm font-bold text-slate-800 mb-3.5">Quick Actions</h2>
  <div class="grid grid-cols-3 gap-2.5">
    <!-- Action 1: Start Break -->
    <button
      type="button"
      data-testid="quick-action-break"
      class="group flex flex-col items-center justify-center p-3 rounded-xl border border-slate-200/70 hover:border-emerald-300 hover:bg-emerald-50/30 transition-all text-center cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="breakDisabled() || breakBusy()"
      (click)="toggleBreak()"
    >
      <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-2 group-hover:scale-105 transition-transform shadow-2xs">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
        </svg>
      </div>
      <span class="text-xs font-bold text-slate-800 leading-tight" data-testid="quick-action-break-label">
        {{ breakBusy() ? 'Working…' : breakLabel() }}
      </span>
      <span class="text-[10px] text-slate-400 mt-0.5">Take a pause</span>
    </button>

    <!-- Action 2: My Insights -->
    <a
      routerLink="/dashboard/insights"
      data-testid="quick-action-insights"
      class="group flex flex-col items-center justify-center p-3 rounded-xl border border-slate-200/70 hover:border-blue-300 hover:bg-blue-50/30 transition-all text-center cursor-pointer"
    >
      <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-2 group-hover:scale-105 transition-transform shadow-2xs">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
        </svg>
      </div>
      <span class="text-xs font-bold text-slate-800 leading-tight">My Insights</span>
      <span class="text-[10px] text-slate-400 mt-0.5">View analytics</span>
    </a>

    <!-- Action 3: Activity Timeline -->
    <a
      routerLink="/dashboard/activity-timeline"
      data-testid="quick-action-activity-timeline"
      class="group flex flex-col items-center justify-center p-3 rounded-xl border border-slate-200/70 hover:border-purple-300 hover:bg-purple-50/30 transition-all text-center cursor-pointer"
    >
      <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center mb-2 group-hover:scale-105 transition-transform shadow-2xs">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke-width="1.8"></circle>
          <path d="M12 7v5l3 2" stroke-linecap="round" stroke-width="1.8"></path>
        </svg>
      </div>
      <span class="text-xs font-bold text-slate-800 leading-tight">Activity Timeline</span>
      <span class="text-[10px] text-slate-400 mt-0.5">Full activity</span>
    </a>
  </div>
</section>
