<app-card title="Quick Actions">
  <!-- Primary: a real action (starts/ends a break). Kept compact - not full-width - per explicit feedback. -->
  <button
    type="button"
    data-testid="quick-action-break"
    class="inline-flex w-auto self-start items-center justify-center gap-2 rounded-lg bg-[var(--color-accent)] px-4 py-2 text-sm font-medium text-[var(--color-accent-contrast)] transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="breakDisabled() || breakBusy()"
    (click)="toggleBreak()"
  >
    <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
      <path d="M4 3a1 1 0 00-1 1v7a4 4 0 004 4h4a4 4 0 004-4v-1h.5a2.5 2.5 0 000-5H15V4a1 1 0 00-1-1H4zm11 6h.5a.5.5 0 010 1H15V9z" />
    </svg>
    <span data-testid="quick-action-break-label">{{ breakBusy() ? 'Working…' : breakLabel() }}</span>
  </button>

  <!-- Secondary: navigation shortcuts, not actions - lighter, smaller, no icon badge. -->
  <div class="mt-3 grid grid-cols-2 gap-2">
    <a
      routerLink="/dashboard/insights"
      data-testid="quick-action-insights"
      class="rounded-md border border-[var(--color-border)] px-3 py-2 text-center text-xs font-medium text-[var(--color-text-secondary)] transition hover:bg-[var(--color-surface-secondary)] hover:text-[var(--color-text-primary)]"
    >
      My Insights
    </a>

    <a
      routerLink="/dashboard/activity-timeline"
      data-testid="quick-action-activity-timeline"
      class="rounded-md border border-[var(--color-border)] px-3 py-2 text-center text-xs font-medium text-[var(--color-text-secondary)] transition hover:bg-[var(--color-surface-secondary)] hover:text-[var(--color-text-primary)]"
    >
      Activity Timeline
    </a>
  </div>
</app-card>
