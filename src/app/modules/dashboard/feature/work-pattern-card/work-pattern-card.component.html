<app-card>
  <div class="mb-4 flex items-start justify-between">
    <h2 class="text-lg font-semibold text-[var(--color-text-primary)]">Work Pattern</h2>
    <div class="text-right">
      <p class="text-lg font-semibold text-[var(--color-text-primary)]">{{ weeklyFocusLabel() }}</p>
      <p class="text-xs text-[var(--color-text-secondary)]">Focus this week</p>
    </div>
  </div>

  <div class="flex h-40 items-end gap-3 border-b border-[var(--color-border)] pb-1">
    @for (day of days(); track day.label) {
      <div class="flex flex-1 flex-col items-center gap-1">
        <div class="flex h-full w-full flex-col-reverse items-stretch overflow-hidden rounded-t" data-testid="work-pattern-bar">
          <div
            data-testid="work-pattern-segment-focus"
            [style.height.%]="day.focusHeightPercent"
            [style.background-color]="'var(--color-accent)'"
            title="Focus work"
          ></div>
          <div
            data-testid="work-pattern-segment-meeting"
            [style.height.%]="day.meetingHeightPercent"
            [style.background-color]="'var(--color-accent)'"
            [style.opacity]="0.65"
            title="Meetings"
          ></div>
          <div
            data-testid="work-pattern-segment-admin"
            [style.height.%]="day.adminHeightPercent"
            [style.background-color]="'var(--color-border)'"
            title="Admin / other"
          ></div>
        </div>
      </div>
    }
  </div>

  <div class="mt-1 flex gap-3">
    @for (day of days(); track day.label) {
      <span class="flex-1 text-center text-xs text-[var(--color-text-secondary)]">{{ day.label }}</span>
    }
  </div>

  <div class="mt-3 flex items-center gap-4 text-xs text-[var(--color-text-secondary)]">
    <span class="flex items-center gap-1.5">
      <span class="h-2 w-2 rounded-full" [style.background-color]="'var(--color-accent)'"></span>
      Focus
    </span>
    <span class="flex items-center gap-1.5">
      <span class="h-2 w-2 rounded-full" [style.background-color]="'var(--color-accent)'" [style.opacity]="0.65"></span>
      Meetings
    </span>
    <span class="flex items-center gap-1.5">
      <span class="h-2 w-2 rounded-full" [style.background-color]="'var(--color-border)'"></span>
      Admin / other
    </span>
  </div>
</app-card>
