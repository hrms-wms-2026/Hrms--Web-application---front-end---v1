<section class="rounded-2xl border border-[var(--color-border)]/80 bg-[var(--color-surface)] p-5 shadow-xs flex flex-col justify-between h-full" data-purpose="notifications">
  <div>
    <!-- Header -->
    <div class="mb-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h2 class="text-sm font-bold text-[var(--color-text-primary)]">Notifications</h2>
        @if (unreadCount() > 0) {
          <span class="rounded-full border border-[var(--color-accent-subtle)] bg-[var(--color-accent-subtle)] px-2 py-0.5 text-[10px] font-semibold text-[var(--color-accent)]">
            {{ unreadCount() }} new
          </span>
        }
      </div>
      @if (unreadCount() > 0) {
        <button
          type="button"
          class="text-xs font-medium text-[var(--color-text-muted)] transition-colors hover:text-[var(--color-text-secondary)] cursor-pointer"
          data-testid="dashboard-notifications-mark-all-read"
          (click)="onMarkAllRead()"
        >
          Mark all read
        </button>
      }
    </div>

    @if (loading()) {
      <div class="flex flex-col gap-2 animate-pulse py-1">
        <div class="h-11 w-full rounded-xl bg-[var(--color-surface-secondary)]"></div>
        <div class="h-11 w-full rounded-xl bg-[var(--color-surface-secondary)]"></div>
        <div class="h-11 w-full rounded-xl bg-[var(--color-surface-secondary)]"></div>
      </div>
    } @else if (items().length === 0) {
      <div class="flex flex-1 flex-col items-center justify-center gap-2 py-8 text-center" data-testid="dashboard-notifications-empty">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-[var(--color-accent-subtle)] text-[var(--color-accent)]">
          <svg viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
          </svg>
        </span>
        <p class="text-sm font-semibold text-[var(--color-text-primary)]">You're all caught up</p>
        <p class="text-xs text-[var(--color-text-muted)]">No new notifications right now.</p>
      </div>
    } @else {
      <!-- Notifications List -->
      <ul class="space-y-3.5 my-1" data-testid="dashboard-notifications-list">
        @for (item of items(); track item.id) {
          <li>
            <button
              type="button"
              data-testid="dashboard-notifications-row"
              class="group flex w-full items-start justify-between gap-2 text-left transition cursor-pointer p-1 rounded-lg hover:bg-[var(--color-surface-secondary)]"
              (click)="onItemClicked(item)"
            >
              <div class="flex items-start gap-2.5 min-w-0 flex-1 pr-1">
                @if (!item.isRead) {
                  <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-[var(--color-accent)]" aria-hidden="true"></span>
                } @else {
                  <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-[var(--color-border-strong)]" aria-hidden="true"></span>
                }
                <div class="min-w-0 flex-1">
                  <p class="truncate text-xs font-semibold text-[var(--color-text-primary)] group-hover:text-[var(--color-accent)] transition-colors">
                    {{ item.title }}
                  </p>
                  <p class="truncate text-[11px] text-[var(--color-text-muted)] mt-0.5">{{ item.body }}</p>
                </div>
              </div>
              <span class="mt-0.5 shrink-0 whitespace-nowrap text-[10px] text-[var(--color-text-muted)]">
                {{ timeLabel(item.createdAt) }}
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</section>
