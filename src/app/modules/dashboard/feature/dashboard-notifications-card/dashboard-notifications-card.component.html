<app-card>
  <div class="mb-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <h2 class="text-base font-bold text-[var(--color-text-primary)]">Notifications</h2>
      @if (unreadCount() > 0) {
        <span class="rounded-full bg-[var(--color-accent-subtle)] px-2 py-0.5 text-2xs font-bold text-[var(--color-accent)]">
          {{ unreadCount() }} new
        </span>
      }
    </div>
    @if (unreadCount() > 0) {
      <button
        type="button"
        class="inline-flex items-center gap-1.5 text-xs font-semibold text-[var(--color-accent)] transition-opacity hover:opacity-80 cursor-pointer"
        data-testid="dashboard-notifications-mark-all-read"
        (click)="onMarkAllRead()"
      >
        Mark all read
      </button>
    }
  </div>

  <div class="flex max-h-64 flex-col">
    @if (loading()) {
      <div class="flex flex-col gap-2 animate-pulse py-1">
        <div class="h-11 w-full rounded-xl bg-[var(--color-surface-secondary)]"></div>
        <div class="h-11 w-full rounded-xl bg-[var(--color-surface-secondary)]"></div>
        <div class="h-11 w-full rounded-xl bg-[var(--color-surface-secondary)]"></div>
      </div>
    } @else if (items().length === 0) {
      <div class="flex flex-1 flex-col items-center justify-center gap-2 py-8 text-center" data-testid="dashboard-notifications-empty">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-[var(--color-surface-secondary)] text-[var(--color-text-secondary)]">
          <svg viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
          </svg>
        </span>
        <p class="text-sm font-medium text-[var(--color-text-primary)]">You're all caught up</p>
        <p class="text-xs text-[var(--color-text-secondary)]">No new notifications right now.</p>
      </div>
    }

    <ul class="scrollbar-hide min-h-0 flex-1 overflow-y-auto pr-1 flex flex-col gap-2" data-testid="dashboard-notifications-list">
      @for (item of items(); track item.id) {
        <li>
          <button
            type="button"
            data-testid="dashboard-notifications-row"
            class="group flex w-full flex-col gap-1 rounded-xl border p-2.5 text-left text-xs transition cursor-pointer"
            [class.border-[color-mix(in_srgb,var(--color-accent)_22%,var(--color-border))]]="!item.isRead"
            [class.bg-[color-mix(in_srgb,var(--color-accent)_4%,var(--color-surface))]]="!item.isRead"
            [class.border-[var(--color-border)]]="item.isRead"
            [class.bg-[var(--color-surface)]]="item.isRead"
            [class.hover:bg-[var(--color-surface-secondary)]]="true"
            [class.hover:shadow-2xs]="true"
            (click)="onItemClicked(item)"
          >
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                @if (!item.isRead) {
                  <span class="h-2 w-2 shrink-0 rounded-full bg-[var(--color-accent)] shadow-xs" aria-hidden="true"></span>
                } @else {
                  <span class="h-2 w-2 shrink-0 rounded-full bg-[var(--color-border)]" aria-hidden="true"></span>
                }
                <span class="truncate font-semibold text-[var(--color-text-primary)] group-hover:text-[var(--color-accent)]">{{ item.title }}</span>
              </div>
              <span class="shrink-0 text-2xs text-[var(--color-text-secondary)]">{{ timeLabel(item.createdAt) }}</span>
            </div>
            <span class="truncate text-2xs text-[var(--color-text-secondary)] pl-4">{{ item.body }}</span>
          </button>
        </li>
      }
    </ul>
  </div>
</app-card>
