<div class="flex items-start justify-between gap-3">
  <div>
    <h1 class="text-base font-semibold text-[var(--color-text-primary)]">
      {{ timeOfDayGreeting() }}{{ displayName() ? ', ' + displayName() : '' }}! 👋
    </h1>
    <p class="text-xs text-[var(--color-text-secondary)]">Here's what's happening with your work today.</p>
  </div>
  <span class="text-xs text-[var(--color-text-secondary)] font-normal" data-testid="dashboard-greeting-date">
    {{ dateLabel }}
  </span>
</div>
