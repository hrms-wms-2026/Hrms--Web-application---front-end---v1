<app-card>
  <div class="mb-4 flex items-start justify-between">
    <h2 class="text-lg font-semibold text-[var(--color-text-primary)]">Attendance Trend</h2>
    <div class="text-right">
      <p class="text-lg font-semibold text-[var(--color-text-primary)]">
        {{ totalHoursLabel() }} <span class="text-sm font-normal text-[var(--color-text-secondary)]">/ {{ weeklyGoalLabel() }}</span>
      </p>
      <p class="text-xs text-[var(--color-text-secondary)]">Weekly worked hours | Goal: {{ dailyGoalLabel() }}</p>
    </div>
  </div>

  <div class="relative flex h-40 items-end gap-3 border-b border-[var(--color-border)] pb-1">
    <div
      class="pointer-events-none absolute left-0 right-0 z-10 border-t border-dashed border-[var(--color-accent)]"
      [style.bottom.%]="goalLinePercent()"
    ></div>

    @for (day of days(); track day.label) {
      <div class="flex h-full flex-1 items-end justify-center">
        <div
          class="relative flex h-full w-full max-w-[36px] items-end justify-center rounded-t bg-[var(--color-surface-secondary)]"
        >
          <div
            data-testid="attendance-trend-bar"
            class="w-full rounded-t bg-[var(--color-accent)] transition-all duration-300"
            [style.height.%]="day.heightPercent"
            [style.minHeight.px]="day.minutes > 0 ? 4 : 0"
            [attr.title]="day.label + ': ' + day.hoursLabel"
          ></div>
        </div>
      </div>
    }
  </div>

  <div class="mt-1 flex gap-3">
    @for (day of days(); track day.label) {
      <span class="flex-1 text-center text-xs text-[var(--color-text-secondary)]">{{ day.label }}</span>
    }
  </div>
</app-card>
