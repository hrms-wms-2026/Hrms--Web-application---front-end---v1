<section id="faq" class="faq">
  <div class="faq__header">
    <span class="faq__tag">FREQUENTLY ASKED QUESTIONS</span>
    <h2 class="faq__title font-serif">Everything You Need to Know</h2>
    <p class="faq__subtitle">
      Common questions about ONEXSO architecture, WorkPulse agent privacy, deployment, and pricing.
    </p>
  </div>

  <div class="faq__list">
    @for (item of faqs; track item.id) {
      <div class="faq__item" [class.faq__item--open]="openId() === item.id">
        <button
          type="button"
          class="faq__question"
          (click)="toggleFaq(item.id)"
          [attr.aria-expanded]="openId() === item.id"
        >
          <span>{{ item.question }}</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" class="faq__icon">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        @if (openId() === item.id) {
          <div class="faq__answer">
            <p>{{ item.answer }}</p>
          </div>
        }
      </div>
    }
  </div>
</section>
