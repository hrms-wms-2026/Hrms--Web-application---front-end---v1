<section id="faq" class="faq">
  <div class="faq__header">
    <span class="faq__tag">TECHNICAL &amp; SECURITY // FAQ</span>
    <h2 class="faq__title font-serif">Everything You Need to Know</h2>
    <p class="faq__subtitle">
      Common questions about CROWNUS multi-company architecture, WorkPulse privacy guarantees, MDM deployment, and operator provisioning.
    </p>
  </div>

  <div class="faq__list">
    @for (item of faqs; track item.id; let i = $index) {
      <div class="faq__item" [class.faq__item--open]="openId() === item.id">
        <button
          type="button"
          class="faq__question"
          (click)="toggleFaq(item.id)"
          [attr.aria-expanded]="openId() === item.id"
          [attr.aria-controls]="'faq-panel-' + item.id"
          [id]="'faq-btn-' + item.id"
        >
          <span class="faq__q-left">
            <span class="faq__q-idx">0{{ i + 1 }}</span>
            <span class="faq__q-text">{{ item.question }}</span>
          </span>
          <span class="faq__icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="faq__icon">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </span>
        </button>
        <div
          class="faq__answer-grid"
          [id]="'faq-panel-' + item.id"
          role="region"
          [attr.aria-labelledby]="'faq-btn-' + item.id"
          [attr.aria-hidden]="openId() !== item.id"
        >
          <div class="faq__answer-inner">
            <div class="faq__answer">
              <p>{{ item.answer }}</p>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
