<ul class="pillars">
  @for (pillar of pillars; track pillar.icon) {
    <li class="pillars__item">
      <svg class="pillars__icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (pillar.icon) {
          @case ('people') {
            <circle cx="9" cy="8" r="3" />
            <path d="M2.5 20c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6" />
            <circle cx="17" cy="9" r="2.3" />
            <path d="M16 13.6c2.6.4 4.5 2.6 4.5 5.4" />
          }
          @case ('attendance') {
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 3v4M16 3v4" />
            <path d="M8.5 14.5l2.3 2.3 4.7-4.7" />
          }
          @case ('time-off') {
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3.2 3.2" />
          }
          @case ('work') {
            <rect x="3" y="7" width="18" height="13" rx="2" />
            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M3 13h18" />
          }
        }
      </svg>
      <span class="pillars__label">{{ pillar.label }}</span>
    </li>
  }
</ul>
