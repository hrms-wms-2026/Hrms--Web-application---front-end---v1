<div class="flex flex-col gap-4">
  @for (group of groups(); track group.date) {
    <div>
      <div data-testid="calendar-agenda-date-header" class="mb-1 text-sm font-semibold text-[var(--color-text-primary)]">{{ group.date }}</div>
      <div class="flex flex-col gap-1">
        @for (entry of group.entries; track entry.kind + (entry.kind === 'event' ? entry.event.id : entry.block.id)) {
          @if (entry.kind === 'block') {
            <button
              type="button"
              data-testid="planner-agenda-block"
              class="flex items-center gap-2 rounded-md border border-teal-700 bg-teal-50 px-2 py-1.5 text-left text-sm"
              (click)="blockClick.emit(entry.block)"
            >
              <span class="text-xs text-[var(--color-text-secondary)]">{{ clock(entry.block.startAt) }}</span>
              <span class="text-[10px] uppercase tracking-wide text-teal-800">Planned task</span>
              <span class="text-[var(--color-text-primary)]">{{ entry.block.taskTitle }}</span>
            </button>
          } @else {
          @let event = entry.event;
          <button
            type="button"
            data-testid="calendar-agenda-row"
            class="flex items-center gap-2 rounded-md border border-[var(--color-border)] px-2 py-1.5 text-left text-sm hover:bg-[var(--color-surface-secondary)]"
            (click)="eventClick.emit(event.id)"
          >
            <span class="h-2 w-2 shrink-0 rounded-full" [style.background-color]="event.color || 'var(--color-accent)'"></span>
            <span class="text-xs text-[var(--color-text-secondary)]">{{ event.startDate.slice(11, 16) }}</span>
            <span class="text-[var(--color-text-primary)]">{{ event.title }}</span>
            @if (event.hasConflict) {
              <span data-testid="calendar-conflict-marker" class="h-1.5 w-1.5 shrink-0 rounded-full bg-[var(--color-danger)]" aria-hidden="true"></span>
            }
          </button>
          }
        }
      </div>
    </div>
  }
</div>
